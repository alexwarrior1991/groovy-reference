# =====================================================================================
#  Integración continua de groovy-reference.
#
#  Lo que de verdad protege este workflow es el `SmokeSpec`: ejecuta las 204 demos del
#  repositorio y falla si alguna lanza o no imprime nada. Sin él, estos ficheros serían
#  código que COMPILA; con él, son código VERIFICADO.
# =====================================================================================
name: build

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Un push nuevo sobre la misma rama cancela la ejecución anterior: en un PR activo
# sólo interesa el resultado del último commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Todo el repositorio está escrito en español. Sin una configuración regional
      # UTF-8, `sun.jnu.encoding` se queda en POSIX y la JVM no puede escribir rutas
      # de fichero con acentos: eso rompe la compilación, no sólo la salida.
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      # El capítulo 27 usa hilos virtuales, así que 21 es el mínimo. La propiedad
      # `groovyReference.jdk` del pom.xml tiene ese mismo valor.
      - name: Preparar el JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # `verify` compila Groovy y Java (con los stubs del capítulo 26) y ejecuta los
      # 190 tests, incluido el de humo.
      - name: Compilar y testear
        run: ./mvnw -B --no-transfer-progress verify

      # El test de humo llama a `demo.action.call()` directamente. Este paso comprueba
      # además el camino real de entrada (Main -> Launcher) sobre los 30 capítulos,
      # que en los tests sólo se prueba contra capítulos de mentira.
      - name: Ejecutar las 204 demos desde el lanzador
        run: ./mvnw -B -q --no-transfer-progress exec:java -Dexec.args="all" < /dev/null

      - name: Publicar el informe de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-de-tests
          path: target/surefire-reports
          retention-days: 7
          if-no-files-found: ignore
